<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна 2 - Завдання 2</title>
</head>
<body>
    <script>
        'use strict';
        
        function getTerm(i) {
            return Math.pow(-1, i) * (i + 1) / (Math.pow(i, 2) + 2);
        }
        
        function getFactor(m) {
            return (m + 3) / ((m + 7) * (m - 9));
        }

        console.log('Starting task 2 Part 1');
        let S = 0;
        for (let i = 3; i <= 10; i++) {
            S += getTerm(i);
        }
        console.log("S =", S);

        console.log('Starting task 2 Part 2');
        let p = 1;
        for (let m = 2; m <= 8; m++) {
            p *= getFactor(m);
        }
        console.log("p =", p);
    </script>
</body>
</html>
