<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3</title>
</head>
<body>
    <script>
        // Наповнення видів
        speciesRepo.create(new Species({id: 1, name: 'Лев Африканський', family: 'Котові', lifespan: 15, habitat: 'Савана'}));
        speciesRepo.create(new Species({id: 2, name: 'Слон Індійський', family: 'Слонові', lifespan: 60, habitat: 'Тропічний ліс'}));
        speciesRepo.create(new Species({id: 3, name: 'Пінгвін Імператорський', family: 'Пінгвінові', lifespan: 20, habitat: 'Антарктика'}));

        // Наповнення приміщень
        enclosureRepo.create(new Enclosure({id: 1, complexName: 'Сафарі', roomNumber: 101, hasPool: false, area: 500}));
        enclosureRepo.create(new Enclosure({id: 2, complexName: 'Тропіки', roomNumber: 102, hasPool: true, area: 800}));
        enclosureRepo.create(new Enclosure({id: 3, complexName: 'Полярний світ', roomNumber: 201, hasPool: true, area: 300}));

        // Наповнення розміщень (зв'язків)
        placementRepo.create(new Placement({id: 1, speciesId: 1, enclosureId: 1, animalCount: 3, placementDate: '2025-05-10', enclosureStatus: 'Відмінний'}));
        placementRepo.create(new Placement({id: 2, speciesId: 2, enclosureId: 2, animalCount: 2, placementDate: '2025-06-15', enclosureStatus: 'Задовільний'}));
        placementRepo.create(new Placement({id: 3, speciesId: 1, enclosureId: 2, animalCount: 1, placementDate: '2026-01-20', enclosureStatus: 'Ремонт'})); // Лев тимчасово в іншому вольєрі

        console.log("Види:", speciesRepo.readAll());
        console.log("Приміщення:", enclosureRepo.readAll());
        console.log("Розміщення:", placementRepo.readAll());
    </script>
</body>
</html>
