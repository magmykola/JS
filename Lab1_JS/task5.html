<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна 1 - Завдання 5</title>
</head>
<body>
    <script>
        'use strict';
        console.log('Starting task 5 Part 1 (Sum)');
        let S = 0;
        for (let i = 3; i <= 10; i++) {
            S += Math.pow(-1, i) * (i + 1) / (Math.pow(i, 2) + 2);
        }
        console.log("S =", S);

        console.log('Starting task 5 Part 2 (Product)');
        let p = 1;
        for (let m = 2; m <= 8; m++) {
            p *= (m + 3) / ((m + 7) * (m - 9));
        }
        console.log("p =", p);
    </script>
</body>
</html>
