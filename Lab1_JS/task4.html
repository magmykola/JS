<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна 1 - Завдання 4</title>
</head>
<body>
    <script>
        'use strict';
        function calcY(x) {
            return Math.acos(x - 1) / (x + 2);
        }

        console.log('Starting task 4 Part a');
        const a = 0;
        const b = 2;
        const dx = 0.2;
        
        for (let x = a; x <= b + 1e-9; x += dx) {
            console.log(`x = ${x.toFixed(3)}, y = ${calcY(x).toFixed(5)}`);
        }

        console.log('Starting task 4 Part b');
        let x2 = 0.5;
        const dx2 = 0.15;
        let n = 5;
        
        while (n > 0) {
            console.log(`x = ${x2.toFixed(3)}, y = ${calcY(x2).toFixed(5)}`);
            x2 += dx2;
            n--;
        }
    </script>
</body>
</html>
